# Local development stack: web dashboard + API + SQLite (file-based, zero cost).
# Usage: cp .env.example .env && docker compose up
# Dashboard: http://localhost:3000   API: http://localhost:4000

services:
  api:
    build:
      context: ./apps/api
    ports:
      - "${API_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      - API_PORT=4000
      - SQLITE_PATH=/data/control-plane.db
    volumes:
      - agentos-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agentos-data:
